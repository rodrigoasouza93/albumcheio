name: Keep Render Awake

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Call Render health endpoint
        run: |
          curl --fail --show-error --silent \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            https://albumcheio.onrender.com/api/v1/health
